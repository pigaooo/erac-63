---
deployment:
  tasks:
    - export REPOPATH=/home2/thi19135/repositories/erac63
    - export DESTPATH=/home2/thi19135/public_html/erac-63
    
    # 1. Sincroniza os arquivos do repositório para a pasta pública
    # (O rsync ignora a pasta .git para não expor dados sensíveis)
    - /usr/bin/rsync -avz --exclude='.git' $REPOPATH/ $DESTPATH
    
    # 2. Entra na pasta de destino para rodar os comandos do Laravel
    - cd $DESTPATH
    
    # 3. Configura o ambiente (Copia apenas se não existir)
    - /bin/cp -n .env.example .env
    
    # 4. Instala dependências e roda comandos do Laravel
    - /usr/local/bin/ea-php83 -d memory_limit=512M /opt/cpanel/composer/bin/composer install --no-dev --optimize-autoloader --no-interaction
    - /usr/local/bin/ea-php83 artisan key:generate --no-interaction
    - /usr/local/bin/ea-php83 artisan migrate --force --seed --no-interaction
    - /usr/local/bin/ea-php83 artisan optimize
